name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      # Full suite, excluding the tagged slow test (1MB encryption round-trip).
      - name: flutter test
        run: flutter test --exclude-tags=slow --concurrency=1

  test-slow:
    name: Test (slow, tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      # 1MB AES-GCM round-trip — runs separately to keep the main suite fast.
      - name: flutter test (slow)
        run: flutter test --tags=slow --concurrency=1
