name: freya_pdf
description: "Freya PDF — a clean, fast, ad-free PDF reader with E2E encryption."
publish_to: 'none'
version: 1.5.1+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  shared_preferences: ^2.5.5
  permission_handler: ^11.3.1
  device_info_plus: ^11.0.0
  lottie: ^3.3.1
  share_plus: ^10.1.4
  file_picker: ^8.0.0
  flutter_svg: ^2.0.0
  path_provider: ^2.1.0
  pdfrx: ^2.3.0
  flutter_secure_storage: ^9.2.0
  local_auth: ^3.0.1
  package_info_plus: ^8.0.0
  http: ^1.2.0
  open_filex: ^4.5.0
  crypto: ^3.0.7
  flutter_jailbreak_detection_plus: ^1.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  local_auth_platform_interface: ^1.1.0
  flutter_secure_storage_platform_interface: ^1.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/logo/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: false
  image_path: "assets/logo/FREYA PDF.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/FREYA PDF.png"
  min_sdk_android: 21
